contract:
  name: martyns_law_venue
  # Template-level attestation: proposed by the OpenDQV Cloud team (the golden
  # starter library) and approved by the OpenDQV core team, which mirrors it.
  # A customer forking this contract overwrites these fields with their own
  # organisational attestation through their approve workflow.
  owner_email: opendqv@bgmsconsultants.com
  proposed_by: opendqv-cloud-team
  proposed_at: "2026-09-03T00:00:00+00:00"
  approved_by: opendqv-core-team
  approved_at: "2026-09-03T00:00:00+00:00"
  version: "1.1"
  description: |
      OpenDQV Cloud starter template (v0.1) — your tenant inherits this baseline. First customer edit creates v1.0 in your audit trail; pin by yaml_hash for replay.

      Martyn's Law (Terrorism (Protection of Premises) Act 2025 c. 10) compliance contract for venue operators. Enforces, for ALL qualifying premises (200+ capacity, both tiers): documented public protection procedures (s.5(3) — evacuation, invacuation, lockdown, and communication) and SIA notification (s.9). For enhanced-duty venues (800+): a named designated senior individual (s.10 — required where the responsible person is not an individual) and public protection measures with the s.7 compliance document. Staff-procedure awareness is captured as good practice — the Act as passed imposes no staff-training mandate. All enforced at the point of write, before the compliance record is saved. Named after Martyn Hett (1987–2017), killed in the Manchester Arena attack. The omission failure mode this contract prevents: "we didn't fill that field in."
  owner: Public Safety Data Team
  status: active
  asset_id: urn:opendqv:martyns_law_venue
  rules:
      - name: venue_id_required
        field: venue_id
        type: not_empty
        severity: error
        error_message: venue_id is required — every venue record must be uniquely identifiable
      - name: venue_name_required
        field: venue_name
        type: not_empty
        severity: error
        error_message: venue_name is required
      - name: venue_address_required
        field: venue_address
        type: not_empty
        severity: error
        error_message: venue_address is required
      - name: capacity_required
        field: capacity
        type: not_empty
        severity: error
        error_message: capacity is required — Martyn's Law applies to premises with a capacity of 200 or more
      - name: capacity_minimum
        field: capacity
        type: min
        min: 200
        severity: error
        error_message: capacity must be >= 200 — Martyn's Law applies only to venues with a qualifying capacity of 200 or more persons
      - name: venue_type_required
        field: venue_type
        type: not_empty
        severity: error
        error_message: venue_type is required
      - name: venue_type_valid
        field: venue_type
        type: lookup
        lookup_file: ref/martyns_law_venue_types.txt
        severity: error
        error_message: 'venue_type must be one of: arena, conference_centre, hotel, museum_gallery, nightclub, place_of_worship, pub_bar, restaurant, shopping_centre, sports_stadium, theatre, other'
      - name: duty_tier_required
        field: duty_tier
        type: not_empty
        severity: error
        error_message: duty_tier is required — declare 'standard' (200–799 capacity) or 'enhanced' (800+ capacity)
      - name: duty_tier_valid
        field: duty_tier
        type: lookup
        lookup_file: ref/martyns_law_duty_tiers.txt
        severity: error
        error_message: duty_tier must be 'standard' or 'enhanced'
      - name: evacuation_procedure_documented_required
        field: evacuation_procedure_documented
        type: not_empty
        severity: error
        error_message: evacuation_procedure_documented must be declared (true or false) — Martyn's Law requires a documented evacuation procedure for all in-scope premises
      - name: evacuation_procedure_documented_valid
        field: evacuation_procedure_documented
        type: lookup
        lookup_file: ref/allergen_boolean.txt
        severity: error
        error_message: evacuation_procedure_documented must be 'true' or 'false'
      - name: invacuation_procedure_documented_required
        field: invacuation_procedure_documented
        type: not_empty
        severity: error
        error_message: invacuation_procedure_documented must be declared (true or false) — invacuation (shelter-in-place) procedures are one of the four s.5(3) public protection procedure types, required at both duty tiers
      - name: invacuation_procedure_documented_valid
        field: invacuation_procedure_documented
        type: lookup
        lookup_file: ref/allergen_boolean.txt
        severity: error
        error_message: invacuation_procedure_documented must be 'true' or 'false'
      - name: lockdown_procedure_documented_required
        field: lockdown_procedure_documented
        type: not_empty
        severity: error
        error_message: lockdown_procedure_documented must be declared (true or false) — lockdown procedures are one of the four s.5(3) public protection procedure types, required at both duty tiers
      - name: lockdown_procedure_documented_valid
        field: lockdown_procedure_documented
        type: lookup
        lookup_file: ref/allergen_boolean.txt
        severity: error
        error_message: lockdown_procedure_documented must be 'true' or 'false'
      - name: communication_procedure_documented_required
        field: communication_procedure_documented
        type: not_empty
        severity: error
        error_message: communication_procedure_documented must be declared (true or false) — procedures for providing information to individuals on the premises are the fourth public protection procedure type (s.5(3)(d))
      - name: communication_procedure_documented_valid
        field: communication_procedure_documented
        type: lookup
        lookup_file: ref/allergen_boolean.txt
        severity: error
        error_message: communication_procedure_documented must be 'true' or 'false'
      - name: staff_training_completed_required
        field: staff_training_completed
        type: not_empty
        severity: error
        error_message: staff_training_completed must be declared (true or false) — the Act imposes no staff-training mandate; this records whether individuals working on the premises have been trained on the s.5 public protection procedures they must follow (good practice, not a statutory requirement)
      - name: staff_training_completed_valid
        field: staff_training_completed
        type: lookup
        lookup_file: ref/allergen_boolean.txt
        severity: error
        error_message: staff_training_completed must be 'true' or 'false'
      - name: staff_training_date_required_if_completed
        field: staff_training_date
        type: required_if
        required_if:
          field: staff_training_completed
          value: 'true'
        severity: error
        error_message: staff_training_date is required when staff_training_completed is true — record the date training was completed
      - name: staff_training_date_format
        field: staff_training_date
        type: date_format
        condition:
          field: staff_training_completed
          value: 'true'
        severity: error
        error_message: staff_training_date must be a valid date (YYYY-MM-DD)
      - name: senior_responsible_person_required_if_enhanced
        field: senior_responsible_person
        type: required_if
        required_if:
          field: duty_tier
          value: enhanced
        severity: error
        error_message: senior_responsible_person is required for enhanced-duty venues — Martyn's Law mandates a named designated senior individual for premises with a capacity of 800+; the Act's term is 'designated senior individual' (s.10)
      - name: senior_responsible_person_role_required_if_enhanced
        field: senior_responsible_person_role
        type: required_if
        required_if:
          field: duty_tier
          value: enhanced
        severity: error
        error_message: senior_responsible_person_role is required for enhanced-duty venues — record the organisational role of the designated senior individual (s.10)
      - name: sia_notification_reference_required
        field: sia_registration_number
        type: not_empty
        severity: error
        error_message: sia_registration_number is required for ALL qualifying premises — any person who becomes responsible for qualifying premises, standard or enhanced tier, must notify the Security Industry Authority (s.9(1)); record the SIA notification reference
      - name: terrorism_protection_plan_documented_required_if_enhanced
        field: terrorism_protection_plan_documented
        type: required_if
        required_if:
          field: duty_tier
          value: enhanced
        severity: error
        error_message: terrorism_protection_plan_documented is required for enhanced-duty venues — a public protection plan document (ss.5–7) is mandated for premises with a capacity of 800+
      - name: terrorism_protection_plan_documented_valid
        field: terrorism_protection_plan_documented
        type: lookup
        lookup_file: ref/allergen_boolean.txt
        condition:
          field: duty_tier
          value: enhanced
        severity: error
        error_message: terrorism_protection_plan_documented must be 'true' or 'false'
      - name: terrorism_protection_plan_review_date_required_if_ttp_documented
        field: terrorism_protection_plan_review_date
        type: required_if
        required_if:
          field: terrorism_protection_plan_documented
          value: 'true'
        severity: error
        error_message: terrorism_protection_plan_review_date is required when terrorism_protection_plan_documented is true — record the date the plan was last reviewed
      - name: terrorism_protection_plan_review_date_format
        field: terrorism_protection_plan_review_date
        type: date_format
        condition:
          field: terrorism_protection_plan_documented
          value: 'true'
        severity: error
        error_message: terrorism_protection_plan_review_date must be a valid date (YYYY-MM-DD)
      - name: compliance_reviewed_by_required
        field: compliance_reviewed_by
        type: not_empty
        severity: error
        error_message: compliance_reviewed_by is required — record who verified the compliance declarations before the record was saved
      - name: compliance_review_date_required
        field: compliance_review_date
        type: not_empty
        severity: error
        error_message: compliance_review_date is required — record the date of the compliance review
      - name: compliance_review_date_format
        field: compliance_review_date
        type: date_format
        severity: error
        error_message: compliance_review_date must be a valid date (YYYY-MM-DD)
