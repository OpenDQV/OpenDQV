contract:
  name: banking_transaction
  # Template-level attestation: proposed by the OpenDQV Cloud team (the golden
  # starter library) and approved by the OpenDQV core team, which mirrors it.
  # A customer forking this contract overwrites these fields with their own
  # organisational attestation through their approve workflow.
  owner_email: opendqv@bgmsconsultants.com
  proposed_by: opendqv-cloud-team
  proposed_at: "2026-09-03T00:00:00+00:00"
  approved_by: opendqv-core-team
  approved_at: "2026-09-03T00:00:00+00:00"
  version: "1.2"
  description: |-
      OpenDQV Cloud starter template (v0.1) — your tenant inherits this baseline. First customer edit creates v1.0 in your audit trail; pin by yaml_hash for replay.

      Banking transaction record validation
  owner: Payments Data Team
  status: active
  asset_id: urn:opendqv:banking_transaction
  strict_schema: true
  rules:
      - name: transaction_id_required
        field: transaction_id
        type: not_empty
        severity: error
        error_message: transaction_id is required
      - name: account_number_required
        field: account_number
        type: not_empty_string
        severity: error
        error_message: account_number is required (send as a JSON string to preserve leading zeros)
      - name: account_number_min_length
        field: account_number
        type: min_length
        min_length: 6
        severity: error
        error_message: account_number must be at least 6 characters
      - name: sort_code_format
        field: sort_code
        type: regex
        pattern: ^\d{2}-\d{2}-\d{2}$
        optional: true
        severity: warning
        error_message: sort_code must be in NN-NN-NN format (e.g. 20-00-00) — required for Faster Payments (PSR) and BACS submissions
      - name: bic_format
        field: bic
        type: regex
        pattern: ^[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}([A-Z0-9]{3})?$
        optional: true
        severity: warning
        error_message: bic must be a valid ISO 9362 BIC/SWIFT code (e.g. BARCGB22) — required for SEPA credit transfers and SWIFT cross-border payments
      - name: transaction_date_required
        field: transaction_date
        type: not_empty
        severity: error
        error_message: transaction_date is required
      - name: transaction_date_format
        field: transaction_date
        type: date_format
        severity: error
        error_message: transaction_date must be a valid date (YYYY-MM-DD)
      - name: amount_required
        field: amount
        type: not_empty
        severity: error
        error_message: amount is required
      - name: amount_min
        field: amount
        type: min
        min: 0.01
        severity: error
        error_message: amount must be > 0
      - name: amount_large_transaction_warning
        field: amount
        type: max
        max: 85000
        severity: warning
        error_message: amount exceeds £85,000 FSCS deposit protection limit — enhanced due diligence may be required under Money Laundering Regulations 2017 (MLR17)
      - name: currency_required
        field: currency
        type: not_empty
        severity: error
        error_message: currency is required
      - name: currency_format
        field: currency
        type: regex
        pattern: ^[A-Z]{3}$
        severity: error
        error_message: currency must be a 3-letter ISO 4217 code (e.g. GBP, USD, EUR)
      - name: transaction_type_required
        field: transaction_type
        type: not_empty
        severity: error
        error_message: transaction_type is required
      - name: transaction_type_valid
        field: transaction_type
        type: allowed_values
        allowed_values:
          - debit
          - credit
          - transfer
          - payment
          - refund
          - fee
          - chargeback
          - reversal
        severity: error
        error_message: 'transaction_type must be one of: debit, credit, transfer, payment, refund, fee, chargeback, reversal — chargeback/reversal trigger Consumer Duty and Payment Services Regulations 2017 obligations'
      - name: channel_required
        field: channel
        type: not_empty
        severity: error
        error_message: channel is required
      - name: channel_valid
        field: channel
        type: allowed_values
        allowed_values:
          - online
          - mobile
          - branch
          - atm
          - pos
          - api
          - open_banking
        severity: error
        error_message: 'channel must be one of: online, mobile, branch, atm, pos, api, open_banking — open_banking is PSD2 Article 66/67 regulated (AISP/PISP access)'
      - name: reference_max_length
        field: reference
        type: max_length
        max_length: 18
        optional: true
        severity: error
        error_message: reference must not exceed 18 characters — Faster Payments Service limit; longer references are silently truncated by receiving banks causing reconciliation failures
      - name: merchant_id_required
        field: merchant_id
        type: required_if
        required_if:
          field: channel
          value: pos
        severity: warning
        error_message: merchant_id is required when channel is 'pos' (Point of Sale card-present transactions)
