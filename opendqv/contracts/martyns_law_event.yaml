contract:
  name: martyns_law_event
  # Template-level attestation: proposed by the OpenDQV Cloud team (the golden
  # starter library) and approved by the OpenDQV core team, which mirrors it.
  # A customer forking this contract overwrites these fields with their own
  # organisational attestation through their approve workflow.
  owner_email: opendqv@bgmsconsultants.com
  proposed_by: opendqv-cloud-team
  proposed_at: "2026-09-03T00:00:00+00:00"
  approved_by: opendqv-core-team
  approved_at: "2026-09-03T00:00:00+00:00"
  version: "1.2"
  description: |
      OpenDQV Cloud starter template (v0.1) — your tenant inherits this baseline. First customer edit creates v1.0 in your audit trail; pin by yaml_hash for replay.

      Martyn's Law (Terrorism (Protection of Premises) Act 2025 c. 10) compliance contract for qualifying events — events where 800 or more individuals may be present at the same time (s.3(1)(d)), at premises that are not themselves enhanced-duty premises (s.3(1)(b) — an 800+ event at an enhanced-duty venue is governed through the premises duties instead); there is no 200-person tier — all qualifying events carry the enhanced-level requirements (ss.6–7). Distinct from martyns_law_venue: the responsible person is whoever will have control of the premises in connection with their use for the event (s.4(1)(b) — often but not necessarily the organiser), the SIA obligation is notification, and all procedures are event-specific and time-bounded.
  owner: Public Safety Data Team
  status: active
  asset_id: urn:opendqv:martyns_law_event
  rules:
      - name: event_id_required
        field: event_id
        type: not_empty
        severity: error
        error_message: event_id is required — every qualifying event record must be uniquely identifiable
      - name: event_name_required
        field: event_name
        type: not_empty
        severity: error
        error_message: event_name is required
      - name: event_location_required
        field: event_location
        type: not_empty
        severity: error
        error_message: event_location is required — record the address or site name of the event
      - name: event_organiser_required
        field: event_organiser
        type: not_empty
        severity: error
        error_message: event_organiser is required — record the responsible person for the event, meaning the person who will have control of the premises at which the event is held in connection with their use for the event (s.4(1)(b)); this is often but not necessarily the organiser
      - name: event_type_required
        field: event_type
        type: not_empty
        severity: error
        error_message: event_type is required
      - name: event_type_valid
        field: event_type
        type: lookup
        lookup_file: ref/martyns_law_event_types.txt
        severity: error
        error_message: 'event_type must be one of: concert_live_music, festival, sports_event, conference_exhibition, market_fair, religious_gathering, protest_demonstration, film_production, other'
      - name: expected_attendance_required
        field: expected_attendance
        type: not_empty
        severity: error
        error_message: expected_attendance is required — qualifying events require 800 or more individuals (s.3(1)(d)); there is no 200-person tier — all qualifying events carry the enhanced-level duties
      - name: expected_attendance_minimum
        field: expected_attendance
        type: min
        min: 800
        severity: error
        error_message: expected_attendance must be >= 800 — qualifying events require 800 or more individuals (s.3(1)(d)); there is no 200-person tier — all qualifying events carry the enhanced-level duties
      - name: event_start_date_required
        field: event_start_date
        type: not_empty
        severity: error
        error_message: event_start_date is required
      - name: event_start_date_format
        field: event_start_date
        type: date_format
        severity: error
        error_message: event_start_date must be a valid date (YYYY-MM-DD)
      - name: event_end_date_required
        field: event_end_date
        type: not_empty
        severity: error
        error_message: event_end_date is required
      - name: event_end_date_format
        field: event_end_date
        type: date_format
        severity: error
        error_message: event_end_date must be a valid date (YYYY-MM-DD)
      - name: evacuation_procedure_documented_required
        field: evacuation_procedure_documented
        type: not_empty
        severity: error
        error_message: evacuation_procedure_documented must be declared (true or false) — a documented evacuation procedure is required for all qualifying events under Martyn's Law
      - name: evacuation_procedure_documented_valid
        field: evacuation_procedure_documented
        type: lookup
        lookup_file: ref/allergen_boolean.txt
        severity: error
        error_message: evacuation_procedure_documented must be 'true' or 'false'
      - name: invacuation_procedure_documented_required
        field: invacuation_procedure_documented
        type: not_empty
        severity: error
        error_message: invacuation_procedure_documented must be declared (true or false) — a shelter-in-place procedure is required for all qualifying events
      - name: invacuation_procedure_documented_valid
        field: invacuation_procedure_documented
        type: lookup
        lookup_file: ref/allergen_boolean.txt
        severity: error
        error_message: invacuation_procedure_documented must be 'true' or 'false'
      - name: lockdown_procedure_documented_required
        field: lockdown_procedure_documented
        type: not_empty
        severity: error
        error_message: lockdown_procedure_documented must be declared (true or false) — a lockdown procedure is required for all qualifying events under Martyn's Law
      - name: lockdown_procedure_documented_valid
        field: lockdown_procedure_documented
        type: lookup
        lookup_file: ref/allergen_boolean.txt
        severity: error
        error_message: lockdown_procedure_documented must be 'true' or 'false'
      - name: communication_procedure_documented_required
        field: communication_procedure_documented
        type: not_empty
        severity: error
        error_message: communication_procedure_documented must be declared (true or false) — procedures for providing information to individuals on the premises are the fourth public protection procedure type (s.5(3)(d))
      - name: communication_procedure_documented_valid
        field: communication_procedure_documented
        type: lookup
        lookup_file: ref/allergen_boolean.txt
        severity: error
        error_message: communication_procedure_documented must be 'true' or 'false'
      - name: staff_briefing_completed_required
        field: staff_briefing_completed
        type: not_empty
        severity: error
        error_message: staff_briefing_completed must be declared (true or false) — the Act imposes no statutory briefing mandate; this records whether event staff have been briefed on the s.5 public protection procedures they must follow (good practice, not a statutory requirement)
      - name: staff_briefing_completed_valid
        field: staff_briefing_completed
        type: lookup
        lookup_file: ref/allergen_boolean.txt
        severity: error
        error_message: staff_briefing_completed must be 'true' or 'false'
      - name: staff_briefing_date_required_if_completed
        field: staff_briefing_date
        type: required_if
        required_if:
          field: staff_briefing_completed
          value: 'true'
        severity: error
        error_message: staff_briefing_date is required when staff_briefing_completed is true — record the date the pre-event staff briefing was completed
      - name: staff_briefing_date_format
        field: staff_briefing_date
        type: date_format
        condition:
          field: staff_briefing_completed
          value: 'true'
        severity: error
        error_message: staff_briefing_date must be a valid date (YYYY-MM-DD)
      - name: senior_responsible_person_required
        field: senior_responsible_person
        type: not_empty
        severity: error
        error_message: senior_responsible_person is required — Martyn's Law mandates a named designated senior individual for qualifying events with an expected attendance of 800+; the Act's term is 'designated senior individual' (s.10)
      - name: senior_responsible_person_role_required
        field: senior_responsible_person_role
        type: not_empty
        severity: error
        error_message: senior_responsible_person_role is required — record the organisational role of the designated senior individual (s.10)
      - name: sia_notification_reference_required
        field: sia_notification_reference
        type: not_empty
        severity: warning
        error_message: sia_notification_reference should be recorded once the Security Industry Authority has been notified — qualifying events (800+ expected attendance) must notify the SIA before the event; the reference cannot exist at the moment the record is first written, so this is advisory until it does
      - name: terrorism_protection_plan_documented_required
        field: terrorism_protection_plan_documented
        type: not_empty
        severity: error
        error_message: terrorism_protection_plan_documented is required — documented public protection procedures and measures for the event, per ss.5–7, are mandated for qualifying events with 800+ expected attendance
      - name: terrorism_protection_plan_documented_valid
        field: terrorism_protection_plan_documented
        type: lookup
        lookup_file: ref/allergen_boolean.txt
        severity: error
        error_message: terrorism_protection_plan_documented must be 'true' or 'false'
      - name: terrorism_protection_plan_review_date_required_if_ttp_documented
        field: terrorism_protection_plan_review_date
        type: required_if
        required_if:
          field: terrorism_protection_plan_documented
          value: 'true'
        severity: error
        error_message: terrorism_protection_plan_review_date is required when terrorism_protection_plan_documented is true
      - name: terrorism_protection_plan_review_date_format
        field: terrorism_protection_plan_review_date
        type: date_format
        condition:
          field: terrorism_protection_plan_documented
          value: 'true'
        severity: error
        error_message: terrorism_protection_plan_review_date must be a valid date (YYYY-MM-DD)
      - name: compliance_reviewed_by_required
        field: compliance_reviewed_by
        type: not_empty
        severity: error
        error_message: compliance_reviewed_by is required — record who verified the compliance declarations before the event record was saved
      - name: compliance_review_date_required
        field: compliance_review_date
        type: not_empty
        severity: error
        error_message: compliance_review_date is required
      - name: compliance_review_date_format
        field: compliance_review_date
        type: date_format
        severity: error
        error_message: compliance_review_date must be a valid date (YYYY-MM-DD)
