name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly on Saturday at 01:30 UTC
    - cron: '30 1 * * 6'
  push:
    branches: [main]

# Least-privilege: only read by default; individual jobs opt in to more
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Scorecard requires a public repo — skips silently on private, activates on go-live
    if: github.event.repository.visibility == 'public'
    permissions:
      security-events: write   # upload SARIF to GitHub code scanning
      id-token: write          # publish results to OpenSSF REST API
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # publish_results feeds the badge at securityscorecards.dev
          # Requires the repo to be public — activates automatically on go-live
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to GitHub code-scanning dashboard
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v3
        with:
          sarif_file: results.sarif
