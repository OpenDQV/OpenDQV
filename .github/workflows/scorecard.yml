name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly on Saturday at 01:30 UTC
    - cron: '30 1 * * 6'
  push:
    branches: [main]

# Least-privilege: only read by default; individual jobs opt in to more
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Scorecard requires a public repo — skips silently on private, activates on go-live
    if: github.event.repository.visibility == 'public'
    permissions:
      security-events: write   # upload SARIF to GitHub code scanning
      id-token: write          # publish results to OpenSSF REST API
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5  # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          # publish_results feeds the badge at securityscorecards.dev
          # Requires the repo to be public — activates automatically on go-live
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to GitHub code-scanning dashboard
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v3
        with:
          sarif_file: results.sarif
