name: Create Release

# Trigger manually from GitHub UI: Actions → Create Release → Run workflow
# Prerequisites before running:
#   1. Add the new version section to CHANGELOG.md and push to main
#   2. Choose the bump type below
#
# What this workflow does:
#   1. Calculates the new version from pyproject.toml + bump type
#   2. Extracts release notes from CHANGELOG.md for that version
#   3. Creates and pushes the git tag
#   4. Creates a published GitHub release with the CHANGELOG notes
#
# What fires automatically after:
#   - publish.yml   → PyPI publish. Dispatched explicitly by this workflow
#                     (workflow_dispatch is the one event a GITHUB_TOKEN-created
#                     tag/release IS allowed to trigger). The PyPI trusted
#                     publisher is registered against publish.yml + the `pypi`
#                     environment, so publishing must run inside publish.yml —
#                     an inline job here presents claims PyPI has no publisher
#                     for (`invalid-publisher`, the v2.5.0 failure).
#   - docker-publish.yml → Docker multi-arch image (triggered by the tag push)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write
  actions: write   # to dispatch publish.yml

jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pip install poetry==2.3.2

      - name: Calculate new version
        id: version
        run: |
          # Use the latest git tag as the base version, not pyproject.toml
          # This keeps versions in sync with releases even when pyproject.toml is not committed
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          CURRENT_VERSION="${LATEST_TAG#v}"
          poetry version "$CURRENT_VERSION"
          poetry version ${{ inputs.bump }}
          echo "version=$(poetry version -s)" >> $GITHUB_OUTPUT

      - name: Verify tag does not already exist
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ steps.version.outputs.version }} already exists. Aborting."
            exit 1
          fi

      - name: Extract CHANGELOG notes for this version
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk "/^## \[$VERSION\]/{found=1;next} found && /^---/{exit} found{print}" CHANGELOG.md > release_notes.txt
          if [ ! -s release_notes.txt ]; then
            echo "No CHANGELOG entry found for v$VERSION."
            echo "Add a '## [$VERSION]' section to CHANGELOG.md before running this workflow."
            exit 1
          fi
          echo "Release notes:"
          cat release_notes.txt

      - name: Create and push tag
        run: |
          git tag v${{ steps.version.outputs.version }}
          git push origin v${{ steps.version.outputs.version }}

      - name: Create GitHub release
        run: |
          # library_manifest.json rides on every release: one SHA-256 per bundled
          # contract's rules and one for the library — the machine-readable
          # record of which starters changed (docs/contract_conformance.md, D5).
          # Releases are immutable once published, so it must be attached here.
          gh release create v${{ steps.version.outputs.version }} \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file release_notes.txt \
            library_manifest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Dispatch PyPI publish
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch publish.yml on the new tag
        run: |
          gh workflow run publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "v${{ needs.release.outputs.version }}" \
            -f version="${{ needs.release.outputs.version }}"
          echo "Dispatched publish.yml for v${{ needs.release.outputs.version }}; track it under Actions → Publish to PyPI."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
